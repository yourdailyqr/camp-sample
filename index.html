<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Camp Chickasaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one full-screen photo card per day; scrim with pinned header, one category, auto-sized entry, pinned footer */
:root{
  --ember:#F5A04A;
  --cream:#FFF4E4;
  --sand:#E9D9C4;
  --pine:#A9D3A6;
  --night:#120d08;
  --line:rgba(255,244,228,.30);
  --f-display:"Alfa Slab One","Rockwell","Georgia",serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --f-body:"Nunito","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
html{height:100vh;height:100svh;height:100dvh;}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--f-body);overflow:hidden;}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;background-color:var(--night);background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden;}
.scrim{position:absolute;left:6%;right:6%;top:6%;bottom:6%;border-radius:28px;background:rgba(0,0,0,.40);display:flex;flex-direction:column;overflow:hidden;}
header{flex:0 0 auto;text-align:center;padding:20px 16px 12px;}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;letter-spacing:.5px;color:var(--cream);text-shadow:0 2px 10px rgba(0,0,0,.6);text-wrap:balance;}
.tag{font-family:var(--f-hand);font-weight:700;font-size:27px;line-height:1.1;color:var(--ember);margin:3px 0 5px;text-shadow:0 2px 8px rgba(0,0,0,.55);}
.date{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);text-shadow:0 1px 6px rgba(0,0,0,.6);}
.rule{flex:0 0 auto;height:1px;background:var(--line);margin:0 18px;}
.pillrow{flex:0 0 auto;display:flex;justify-content:center;padding-top:12px;}
.pill{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--night);background:var(--ember);padding:5px 12px 4px;border-radius:999px;}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 20px 14px;overflow:hidden;}
#entry{width:100%;text-align:center;line-height:1.35;text-shadow:0 2px 10px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:.55em;}
#entry p{margin:0;}
.ref{font-size:.6em;font-weight:800;letter-spacing:.08em;color:var(--pine);}
.sub{font-weight:800;color:var(--pine);font-size:.78em;letter-spacing:.03em;}
.lyrics{white-space:pre-line;font-style:italic;}
.credit{font-size:.5em;color:var(--sand);letter-spacing:.04em;}
.sig{font-family:var(--f-hand);font-weight:700;color:var(--ember);font-size:1.15em;line-height:1.1;}
.items{white-space:pre-line;}
.nw{white-space:nowrap;}
.links{width:100%;display:flex;justify-content:space-between;align-items:center;padding:2px 6px 0;}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--cream);text-decoration:none;letter-spacing:.02em;padding:4px 2px;border-radius:8px;}
.lnk svg{width:20px;height:20px;color:var(--ember);flex:0 0 auto;}
.lnk span{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,244,228,.45);}
.lnk:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}
footer{flex:0 0 auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;}
.nav{width:100%;display:flex;align-items:center;justify-content:space-between;}
.nav button{appearance:none;border:0;background:transparent;color:var(--cream);width:54px;height:50px;display:grid;place-items:center;cursor:pointer;border-radius:12px;padding:0;}
.nav button:disabled{color:rgba(255,244,228,.25);cursor:default;}
.nav button:focus-visible,.vid:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}
.nav svg{width:30px;height:30px;}
.navlabel{font-size:17px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);}
.vid{font-size:17px;font-weight:800;color:var(--ember);text-decoration:underline;text-underline-offset:3px;letter-spacing:.03em;}
@media (max-height:700px){header{padding:13px 14px 9px}h1{font-size:26px}.tag{font-size:23px}.pillrow{padding-top:9px}footer{padding-top:6px;gap:4px}.lnk{font-size:14px}}
@media (max-height:500px),(max-width:340px){h1{font-size:22px}.tag{font-size:19px}.date{font-size:11px}}
</style>
</head>

// Mess Hall Menu: the meal shown matches the weekday of the date being viewed
const MENU = {
  Sunday:["Sunday morning donuts","Scrambled eggs","Sausage patties","Fresh strawberries","Apple juice"],
  Monday:["Flapjack stack with maple syrup","Scrambled eggs","Crispy bacon","Fresh fruit cup","Orange juice and milk"],
  Tuesday:["Biscuits and country gravy","Sausage links","Yogurt with granola","Sliced bananas","Hot cocoa"],
  Wednesday:["Camp-famous cinnamon rolls","Cheesy scrambled eggs","Hash brown patties","Apple slices","Milk and juice"],
  Thursday:["Breakfast burritos","Salsa and sour cream","Breakfast potatoes","Fresh melon","Orange juice"],
  Friday:["French toast sticks","Powdered sugar and berries","Turkey sausage","Hard-boiled eggs","Milk"],
  Saturday:["Waffle bar with all the toppings","Whipped cream and strawberries","Bacon","Fruit salad","Hot cocoa"]
};

// 10-day sample: one category per day
const DAYS = [
 {img:4, cat:"Verse of the Day",
  html:`<p>"You are the light of the world. A city set on a hill cannot be hidden."</p><p class="ref">Matthew 5:14 (ESV)</p>`},
 {img:5, cat:"Campfire Prayer",
  html:`<p>Jesus, thank You for quiet moments and good friends. When life gets busy and loud, remind me that I can always come to You and find rest. Help me be a friend who brings peace. Amen.</p>`},
 {img:6, cat:"Camp Song",
  html:`<p class="sub">Peace Like a River</p><p class="lyrics">I've got peace like a river,
I've got peace like a river,
I've got peace like a river in my soul.
I've got joy like a fountain in my soul!</p><p class="credit">TRADITIONAL</p>`},
 {img:7, cat:"Camp Highlight",
  html:`<p>Nature hike to Eagle Ridge! Our junior campers spotted two red-tailed hawks, a family of deer, and one very sneaky squirrel who stole a granola bar.</p>`},
 {img:8, cat:"Cabin Mail",
  html:`<p>Wren Cabin, remember our sunset talks on the dock? You asked big questions about God, and that made my whole summer. Keep asking!</p><p class="sig"><span class="nw">Counselor Hannah,</span> <span class="nw">Wren Cabin</span></p>`},
 {img:10, cat:"Mess Hall Menu", menu:true},
 {img:9, cat:"Take-It-Home Challenge",
  html:`<p>Text, call, or write a letter to a camp friend today. Let them know you're thinking of them and praying for them.</p>`},
 {img:12, cat:"Pray For...",
  html:`<p>Our lifeguards and waterfront staff, who kept every swimmer and paddler safe all summer long.</p>`},
 {img:11, cat:"Did You Know?",
  html:`<p>The Polar Bear Plunge happens at 7 a.m. on the last morning of camp. This summer, 212 brave campers jumped into Lake Chickasaw!</p>`},
 {img:13, cat:"Director's Corner",
  html:`<p>Next summer is less than a year away, and early registration opens soon. Save your spot. We can't wait to see you back at Camp Chickasaw!</p><p class="sig">Director Dave</p>`}
];

const TODAY_INDEX = 8;          // sample: today shows entry 9, tomorrow entry 10, 8 days ago entry 1
const MIN_OFFSET = -TODAY_INDEX; // back through every sample day
const MAX_OFFSET = 1;            // forward to tomorrow only
let offset = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function label(o){
  if (o === 0) return "Today";
  if (o === 1) return "Tomorrow";
  if (o === -1) return "Yesterday";
  return `${-o} Days Ago`;
}

function fit(){
  const stage = $("stage"), el = $("entry");
  const maxH = stage.clientHeight - 24, maxW = stage.clientWidth - 40;
  let lo = 13, hi = 41, best = 13;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + "px";
    if (el.scrollHeight <= maxH && el.scrollWidth <= maxW + 1){ best = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  el.style.fontSize = best + "px";
}

function render(){
  const d = DAYS[TODAY_INDEX + offset];
  const dt = new Date(2026, 9, 22, 12); dt.setDate(dt.getDate() + offset); // sample: "Today" is always October 22
  $("app").style.backgroundImage = `url("data:image/jpeg;base64,${IMG[d.img]}")`;
  $("date").textContent = dt.toLocaleDateString("en-US",{month:"long",day:"numeric"});
  $("pill").textContent = d.cat;
  if (d.menu){
    const wd = dt.toLocaleDateString("en-US",{weekday:"long"});
    $("entry").innerHTML = `<p class="sub">${esc(wd)} Breakfast at Camp</p><p class="items">${MENU[wd].map(esc).join("\n")}</p>`;
  } else {
    $("entry").innerHTML = d.html;
  }
  $("navlabel").textContent = label(offset);
  $("prev").disabled = offset <= MIN_OFFSET;
  $("next").disabled = offset >= MAX_OFFSET;
  fit();
}

function go(n){ const t = Math.max(MIN_OFFSET, Math.min(MAX_OFFSET, offset + n)); if (t !== offset){ offset = t; render(); } }
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
let sx = 0, sy = 0;
$("app").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("app").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1); }, {passive:true});
window.addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
render();
</script>
